name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the unit tests cover the pure modules (redaction, audit, noise), so only numpy, scikit-learn and pytest are needed
      - run: pip install numpy scikit-learn pytest
      - run: python -m pytest -q
