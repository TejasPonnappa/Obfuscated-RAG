name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the unit tests cover the pure modules (redaction, audit, noise, regexes, corpus), so no Presidio or torch is installed; evals run locally
      - run: pip install numpy scikit-learn pytest faker
      - run: python -m pytest -q
